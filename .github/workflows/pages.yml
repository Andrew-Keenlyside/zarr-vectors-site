name: Build and deploy the site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"   # daily, to pick up docs changes in the source repos
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the Python library (its API pages are read from the code)
        run: git clone -q --depth 1 https://github.com/AllenInstitute/zarr-vectors-py.git .src/zarr-vectors-py
      - name: Install
        run: pip install "sphinx>=7.2,<9" furo myst-parser sphinx-copybutton sphinx-argparse pyyaml ./.src/zarr-vectors-py
      - name: Build
        run: ZV_BASE="/${{ github.event.repository.name }}/" ./build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
